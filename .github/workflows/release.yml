name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK and AAB
        env:
          KNIGHTFALL_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KNIGHTFALL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KNIGHTFALL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KNIGHTFALL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PversionCode=$((100 + ${{ github.run_number }})) \
            -PversionName="1.0.${{ github.run_number }}"

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Knightfall-1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/Knightfall-1.0.${{ github.run_number }}.aab"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Knightfall 1.0.${{ github.run_number }}
          body: |
            ## Knightfall — beautiful chess on Android ♞

            **To install:** download the `.apk` file below on your Android phone, open it, and follow the prompts.
            (You may need to allow installs from your browser the first time.)

            The `.aab` file is the app-store bundle — most people want the `.apk`.
          files: |
            dist/Knightfall-1.0.${{ github.run_number }}.apk
            dist/Knightfall-1.0.${{ github.run_number }}.aab
