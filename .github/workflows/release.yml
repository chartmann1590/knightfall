name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r27
        run: |
          INSTALLED=$(ls -d "$ANDROID_HOME/ndk"/27.* 2>/dev/null | sort -V | tail -1)
          if [ -z "$INSTALLED" ]; then
            echo "Installing NDK 27.2.12479018..."
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" 2>&1 | tail -3
          else
            echo "NDK already present: $INSTALLED"
          fi

      - name: Restore Stockfish binary (16 KB page-compliant)
        id: sf-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libstockfish.so
          key: stockfish-sf18-arm64-16kb-v1

      - name: Build Stockfish for Android arm64 with 16 KB page alignment
        if: steps.sf-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          NDK_ROOT=$(ls -d "$ANDROID_HOME/ndk"/27.* | sort -V | tail -1)
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "Building Stockfish with NDK: $NDK_ROOT"

          # Download Stockfish 18 source
          wget -q "https://github.com/official-stockfish/Stockfish/archive/refs/tags/sf_18.tar.gz" -O sf18.tar.gz
          tar xf sf18.tar.gz

          # Wrapper script: forwards all args to the NDK arm64 clang++ and appends the
          # 16 KB page-size alignment linker flag. The flag is ignored during compilation
          # passes and applied only when clang++ links the final binary.
          WRAPPER="$(pwd)/sf-cxx-wrapper"
          printf '#!/bin/bash\nexec "%s/aarch64-linux-android31-clang++" "$@" -z max-page-size=16384\n' "$NDK_BIN" > "$WRAPPER"
          chmod +x "$WRAPPER"

          cd Stockfish-sf_18/src
          make -j$(nproc) \
            ARCH=armv8 \
            ANDROID_NDK="$NDK_ROOT" \
            ANDROIDV=31 \
            CXX="$WRAPPER" \
            LDFLAGS="-z max-page-size=16384" \
            build

          DEST="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          cp stockfish "$DEST/libstockfish.so"
          echo "Installed 16 KB-aligned Stockfish binary"

      - name: Run unit tests
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_ID: ${{ secrets.ADMOB_BANNER_AD_ID }}
          ADMOB_INTERSTITIAL_AD_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_ID }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK and AAB
        env:
          KNIGHTFALL_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KNIGHTFALL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KNIGHTFALL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KNIGHTFALL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_ID: ${{ secrets.ADMOB_BANNER_AD_ID }}
          ADMOB_INTERSTITIAL_AD_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_ID }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PversionCode=$((100 + ${{ github.run_number }})) \
            -PversionName="1.0.${{ github.run_number }}"

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Knightfall-1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/Knightfall-1.0.${{ github.run_number }}.aab"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Knightfall 1.0.${{ github.run_number }}
          body: |
            ## Knightfall — beautiful chess on Android ♞

            **To install:** download the `.apk` file below on your Android phone, open it, and follow the prompts.
            (You may need to allow installs from your browser the first time.)

            The `.aab` file is the app-store bundle — most people want the `.apk`.
          files: |
            dist/Knightfall-1.0.${{ github.run_number }}.apk
            dist/Knightfall-1.0.${{ github.run_number }}.aab
