name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      confirm_play_publish:
        description: 'Type "publish" to confirm submission to Google Play production'
        required: true
        default: ''
      release_notes:
        description: 'Release notes (optional; uses recent commits if empty)'
        required: false
        default: ''

jobs:
  publish:
    name: Build & publish to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_AD_ID: ${{ secrets.ADMOB_BANNER_AD_ID }}
      ADMOB_INTERSTITIAL_AD_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_ID }}
      GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
      GH_REPO_NAME: ${{ secrets.GH_REPO_NAME }}
      GH_REPO_OWNER: ${{ secrets.GH_REPO_OWNER }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Check confirmation
        if: github.event.inputs.confirm_play_publish != 'publish'
        run: |
          echo "::error::You must type 'publish' in confirm_play_publish to proceed."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Compute version
        id: version
        run: |
          VERSION_CODE="$(date -u +'%y%j%H%M')"
          VERSION_NAME="1.0.0.$(date -u +'%Y%m%d.%H%M')"
          echo "ANDROID_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Run lint
        run: ./gradlew lintRelease

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release AAB
        env:
          KNIGHTFALL_KEYSTORE_PATH: release.keystore
          KNIGHTFALL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KNIGHTFALL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KNIGHTFALL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Generate release notes
        run: |
          WHATSNEW_DIR="distribution/whatsnew"
          mkdir -p "${WHATSNEW_DIR}"
          NOTES="${{ github.event.inputs.release_notes }}"
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > "${WHATSNEW_DIR}/whatsnew-en-US"
          elif git describe --tags --abbrev=0 HEAD^ 2>/dev/null; then
            PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null)"
            git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' > "${WHATSNEW_DIR}/whatsnew-en-US"
          elif [ -f app/src/main/play/listings/whats_new.txt ]; then
            cp app/src/main/play/listings/whats_new.txt "${WHATSNEW_DIR}/whatsnew-en-US"
          else
            printf '%s\n' "Bug fixes and performance improvements." > "${WHATSNEW_DIR}/whatsnew-en-US"
          fi
          echo "Generated whatsnew-en-US:"
          cat "${WHATSNEW_DIR}/whatsnew-en-US"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Verify service account key
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is missing."
            exit 1
          fi
          echo "Service account key present."
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.chartmann.knightfall
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: production
          status: completed
          whatsNewDirectory: distribution/whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt
