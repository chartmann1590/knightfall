firebase-config = { group = "com.google.firebase", name = "firebase-config" }
litertlm = { group = "com.google.ai.edge.litertlm", name = "litertlm-android", version.ref = "litertlm" }
chesslib = { group = "com.github.bhlangonijr", name = "chesslib", version.ref = "chesslib" }
