<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard — Knightfall</title>
  <meta name="description" content="The live Knightfall leaderboard — the top rated chess players, updated in real time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♞</text></svg>">
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a class="nav-brand" href="index.html"><span class="knight">♞</span> Knightfall</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="play.html">Play</a>
        <a href="leaderboard.html" class="active">Leaderboard</a>
        <a href="https://github.com/chartmann1590/knightfall/releases/latest">Download</a>
      </div>
    </div>
  </nav>

  <section>
    <div class="container">
      <h2>🏆 Global Leaderboard</h2>
      <p style="text-align:center; color:var(--smoke); margin-top:-22px; margin-bottom:26px;">
        The top Knightfall players, live. Want your name here? Turn on
        <strong>Public profile</strong> in the app's settings.
      </p>
      <div class="board-wrap" id="board">
        <div class="state-msg" id="loading">
          <span class="big">♞</span>
          Loading the leaderboard…
        </div>
      </div>
    </div>
  </section>

  <footer>
    <p>♞ Knightfall — free chess for Android</p>
    <p><a href="index.html">About the app</a> · <a href="https://github.com/chartmann1590/knightfall/releases/latest">Download</a></p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
  <script>
    (async () => {
      const board = document.getElementById('board');
      try {
        const players = await fetchLeaderboard();
        if (players.length === 0) {
          board.innerHTML = `
            <div class="state-msg">
              <span class="big">♟️</span>
              No public players yet — be the first!<br>
              Turn on <strong>Public profile</strong> in the app to claim the top spot.
            </div>`;
          return;
        }
        board.innerHTML = players.map((p, i) => `
          <a class="lb-row" href="profile.html?uid=${encodeURIComponent(p.uid)}" style="color:inherit; text-decoration:none;">
            <div class="rank ${i < 3 ? 'top' : ''}">${medal(i + 1)}</div>
            <div class="avatar">${escapeHtml(p.username.charAt(0).toUpperCase())}</div>
            <div class="who">
              <div class="name">${escapeHtml(p.username)}</div>
              <div class="record">${p.wins}W · ${p.losses}L · ${p.draws}D</div>
            </div>
            <div class="elo">${p.elo}</div>
          </a>`).join('');
      } catch (e) {
        board.innerHTML = `
          <div class="state-msg">
            <span class="big">⚠️</span>
            Couldn't load the leaderboard right now. Please try again in a moment.
          </div>`;
      }
    })();
  </script>
</body>
</html>
