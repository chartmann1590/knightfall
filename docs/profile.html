<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Profile — Knightfall</title>
  <meta name="description" content="A Knightfall player profile — rating, wins, and stats.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♞</text></svg>">
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a class="nav-brand" href="index.html"><span class="knight">♞</span> Knightfall</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="play.html">Play</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="https://github.com/chartmann1590/knightfall/releases/latest">Download</a>
      </div>
    </div>
  </nav>

  <section>
    <div class="container" id="content" style="display: flex; justify-content: center; min-height: 400px; align-items: center;">
      <div class="state-msg">
        <span class="big">♞</span>
        Loading profile…
      </div>
    </div>
  </section>

  <footer>
    <p>♞ Knightfall — free chess for Android</p>
    <p><a href="leaderboard.html">Back to the leaderboard</a> · <a href="privacy.html">Privacy Policy</a></p>
  </footer>

  <!-- Firebase 9 compat (traditional firebase.auth() / firebase.firestore() API) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
  <script>
    let authMode = 'login';

    function toggleAuthTab(m) {
      authMode = m;
      const usernameField = document.getElementById('username-field');
      const actionBtn = document.getElementById('btn-email-action');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');

      if (m === 'login') {
        usernameField.style.display = 'none';
        actionBtn.textContent = 'Sign In';
        tabLogin.className = 'pbtn pbtn-dark';
        tabRegister.className = 'pbtn pbtn-ghost';
      } else {
        usernameField.style.display = 'block';
        actionBtn.textContent = 'Register';
        tabLogin.className = 'pbtn pbtn-ghost';
        tabRegister.className = 'pbtn pbtn-dark';
      }
    }

    async function handleEmailAuth() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const username = document.getElementById('auth-username').value.trim();
      const actionBtn = document.getElementById('btn-email-action');
      const errEl = document.getElementById('auth-err');

      if (!email || !password) {
        errEl.textContent = 'Please fill in email and password fields.';
        errEl.style.display = 'block';
        return;
      }

      if (authMode === 'register' && username.length < 2) {
        errEl.textContent = 'Username must be at least 2 characters.';
        errEl.style.display = 'block';
        return;
      }

      errEl.style.display = 'none';
      actionBtn.disabled = true;

      try {
        if (authMode === 'login') {
          await auth.signInWithEmailAndPassword(email, password);
        } else {
          const cred = await auth.createUserWithEmailAndPassword(email, password);
          await ensureProfileExists(cred.user, username);
          renderForUser(cred.user);
        }
      } catch(e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
      } finally {
        actionBtn.disabled = false;
      }
    }

    async function doGoogle() {
      const errEl = document.getElementById('auth-err');
      if (errEl) errEl.style.display = 'none';
      document.getElementById('btn-google').disabled = true;
      try {
        const cred = await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
        if (cred.user) {
          await ensureProfileExists(cred.user);
          renderForUser(cred.user);
        }
      } catch(e) {
        if (e.code !== 'auth/popup-closed-by-user') {
          if (errEl) {
            errEl.textContent = 'Google sign-in unavailable here — use Email instead.';
            errEl.style.display = 'block';
          }
        }
      } finally {
        const btn = document.getElementById('btn-google');
        if (btn) btn.disabled = false;
      }
    }

    // Called automatically by app.js when Auth state is resolved/changed
    window.onAuthChanged = async (user) => {
      const uid = new URLSearchParams(location.search).get('uid');
      if (uid) {
        loadProfileForUid(uid);
      } else {
        if (user) {
          await ensureProfileExists(user);
          renderForUser(user);
        } else {
          renderLoginPrompt();
        }
      }
    };

    function renderLoginPrompt() {
      const content = document.getElementById('content');
      content.style.display = 'flex';
      content.innerHTML = `
        <div class="profile-card" style="max-width: 420px; text-align: center; width: 100%;">
          <h2>♟ Player Profile</h2>
          <p class="sub" style="margin-bottom: 20px; color: var(--smoke); font-size: 0.9rem;">Sign in to view your statistics, rating, and match history.</p>
          <div class="pbtns" style="display: flex; flex-direction: column; gap: 10px;">
            <button class="pbtn pbtn-gold" id="btn-google" onclick="doGoogle()">
              <svg style="vertical-align:-3px;margin-right:8px" width="16" height="16" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.3 0 5.9 1.1 8 3l5.9-5.9C34.4 3.3 29.6 1 24 1 14.7 1 6.8 6.6 3.3 14.6l6.9 5.4C12 13.4 17.4 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.4c-.5 2.8-2.1 5.1-4.4 6.7l6.8 5.3c4-3.7 6.3-9.2 6.3-16z"/>
                <path fill="#FBBC05" d="M10.2 28.6A15 15 0 0 1 9.5 24c0-1.6.3-3.1.7-4.6L3.3 14C1.2 18 0 22.4 0 27s1.2 9 3.3 13l6.9-5.4z"/>
                <path fill="#34A853" d="M24 47c5.6 0 10.3-1.9 13.8-5.1l-6.8-5.3c-1.9 1.3-4.3 2-7 2-6.6 0-12-4-13.8-9.4l-6.9 5.4C6.8 41.4 14.7 47 24 47z"/>
              </svg>
              Continue with Google
            </button>

            <div class="divider" style="text-align:center; color:var(--smoke); font-size:.82rem; margin:14px 0;">— or use Email —</div>

            <div style="display: flex; gap: 8px; margin-bottom: 8px; background: var(--surface-2); padding: 4px; border-radius: 8px;">
              <button id="tab-login" class="pbtn pbtn-dark" style="flex: 1; padding: 6px; font-size: 0.85rem; border: none !important;" onclick="toggleAuthTab('login')">Sign In</button>
              <button id="tab-register" class="pbtn pbtn-ghost" style="flex: 1; padding: 6px; font-size: 0.85rem; border: none !important;" onclick="toggleAuthTab('register')">Register</button>
            </div>

            <div id="email-form" style="display: flex; flex-direction: column; gap: 8px; text-align: left;">
              <div id="username-field" style="display: none;">
                <label class="lbl" style="margin: 4px 0 2px; font-size: 0.83rem; color: var(--smoke);">Username</label>
                <input type="text" class="inp" id="auth-username" placeholder="Username" style="width:100%; padding:11px 14px; background:var(--surface-2); border:1px solid rgba(232,181,74,.25); border-radius:10px; color:var(--cream); font-size:.93rem; outline:none;">
              </div>
              <div>
                <label class="lbl" style="margin: 4px 0 2px; font-size: 0.83rem; color: var(--smoke);">Email Address</label>
                <input type="email" class="inp" id="auth-email" placeholder="email@example.com" style="width:100%; padding:11px 14px; background:var(--surface-2); border:1px solid rgba(232,181,74,.25); border-radius:10px; color:var(--cream); font-size:.93rem; outline:none; text-transform: none; letter-spacing: normal;">
              </div>
              <div>
                <label class="lbl" style="margin: 4px 0 2px; font-size: 0.83rem; color: var(--smoke);">Password</label>
                <input type="password" class="inp" id="auth-password" placeholder="••••••••" style="width:100%; padding:11px 14px; background:var(--surface-2); border:1px solid rgba(232,181,74,.25); border-radius:10px; color:var(--cream); font-size:.93rem; outline:none; text-transform: none; letter-spacing: normal;">
              </div>
              <button class="pbtn pbtn-gold" id="btn-email-action" style="width:100%; padding:13px 16px; border-radius:10px; font-weight:600; font-size:.95rem; border:none; cursor:pointer; background:linear-gradient(135deg,var(--gold),var(--gold-deep)); color:#14110f; margin-top: 10px;" onclick="handleEmailAuth()">Sign In</button>
            </div>
          </div>
          <p id="auth-err" class="err" style="color:var(--red); font-size:.85rem; text-align:center; margin-top:10px; display:none"></p>
        </div>`;
    }

    async function loadProfileForUid(uid) {
      const content = document.getElementById('content');
      content.style.display = 'block';
      content.innerHTML = `<div class="state-msg"><span class="big">♞</span>Loading profile…</div>`;

      try {
        const p = await fetchUserProfile(uid);
        if (!p) {
          content.innerHTML = `<div class="state-msg" style="text-align: center;"><span class="big">🕵️</span>This profile is private or doesn't exist.<br><a href="leaderboard.html">Browse the leaderboard</a></div>`;
          return;
        }
        await renderProfileDetails(p);
      } catch (e) {
        content.innerHTML = `<div class="state-msg" style="text-align: center;"><span class="big">⚠️</span>Couldn't load this profile right now.</div>`;
      }
    }

    function renderForUser(user) {
      loadProfileForUid(user.uid);
    }

    async function renderProfileDetails(p) {
      const content = document.getElementById('content');
      content.style.display = 'block';
      
      const gamesPlayed = p.wins + p.losses + p.draws;
      document.title = `${p.username} — Knightfall`;

      const isMe = auth.currentUser && auth.currentUser.uid === p.uid;
      const privacyBadge = p.isPrivateView 
        ? `<div style="display: inline-block; background: rgba(224,122,107,0.15); color: var(--red); font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin-top: 8px;">PRIVATE (ONLY VISIBLE TO YOU)</div>`
        : `<div style="display: inline-block; background: rgba(111,191,115,0.15); color: var(--green); font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin-top: 8px;">PUBLIC PROFILE</div>`;

      content.innerHTML = `
        <div class="profile-card" style="max-width: 540px; margin: 30px auto 20px;">
          <div class="avatar">${escapeHtml(p.username.charAt(0).toUpperCase())}</div>
          <h2>${escapeHtml(p.username)}</h2>
          ${privacyBadge}
          <div class="elo-big">${p.elo}</div>
          <div class="elo-label">ELO RATING</div>
          <div class="stat-grid">
            <div class="stat"><div class="num w">${p.wins}</div><div class="lbl">Wins</div></div>
            <div class="stat"><div class="num l">${p.losses}</div><div class="lbl">Losses</div></div>
            <div class="stat"><div class="num">${p.draws}</div><div class="lbl">Draws</div></div>
            <div class="stat"><div class="num">${p.bestWinStreak}</div><div class="lbl">Best streak</div></div>
          </div>
          <p style="margin-top:22px; color:var(--smoke); font-size:0.9rem;">${gamesPlayed} online game${gamesPlayed === 1 ? '' : 's'} played</p>
        </div>

        <div class="games-section" style="max-width: 540px; margin: 0 auto 40px; text-align: left;">
          <h3 style="font-family: 'Playfair Display', Georgia, serif; font-size: 1.4rem; border-bottom: 1px solid rgba(232, 181, 74, 0.15); padding-bottom: 8px; margin-bottom: 16px; color: var(--gold);">Recent Online Games</h3>
          <div id="games-list">
            <div class="state-msg" style="padding: 20px 0;"><div class="spinner"></div>Loading game history…</div>
          </div>
        </div>
      `;

      // Load games history if signed in
      const listEl = document.getElementById('games-list');
      if (auth.currentUser) {
        try {
          const games = await fetchUserGames(p.uid);
          if (games.length === 0) {
            listEl.innerHTML = `<p style="color: var(--smoke); font-size: 0.95rem; text-align: center; padding: 20px 0;">No online games played yet.</p>`;
          } else {
            listEl.innerHTML = games.map(game => {
              const mySeat = game.whiteUid === p.uid ? 'white' : 'black';
              const opponent = mySeat === 'white' ? (game.blackName || 'Guest') : (game.whiteName || 'Guest');
              const opponentElo = mySeat === 'white' ? (game.blackEloStart || 1200) : (game.whiteEloStart || 1200);
              const dateStr = game.finishedAt ? new Date(game.finishedAt.seconds * 1000).toLocaleDateString() : 'Active';
              
              let outcomeChar = 'D';
              let outcomeClass = 'draw';
              let outcomeColor = 'var(--smoke)';
              
              if (game.result === 'draw') {
                outcomeChar = 'D';
                outcomeClass = 'draw';
                outcomeColor = 'var(--smoke)';
              } else if ((game.result === 'white' && mySeat === 'white') || (game.result === 'black' && mySeat === 'black')) {
                outcomeChar = 'W';
                outcomeClass = 'w';
                outcomeColor = 'var(--green)';
              } else {
                outcomeChar = 'L';
                outcomeClass = 'l';
                outcomeColor = 'var(--red)';
              }

              return `
                <div class="lb-row" style="background: var(--surface); border: 1px solid rgba(232,181,74,0.08); border-radius: 8px; margin-bottom: 8px; padding: 12px 18px; display: flex; align-items: center; gap: 16px;">
                  <div class="num ${outcomeClass}" style="width: 24px; font-weight: 800; font-size: 1.1rem; color: ${outcomeColor};">${outcomeChar}</div>
                  <div class="who" style="flex: 1; min-width: 0;">
                    <div class="name" style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--cream);">
                      vs ${escapeHtml(opponent)} <span style="font-size: 0.8rem; color: var(--smoke); font-weight: 400;">(${opponentElo})</span>
                    </div>
                    <div class="record" style="font-size: 0.82rem; color: var(--smoke);">${game.moves ? game.moves.length : 0} moves · ${dateStr}</div>
                  </div>
                  <div class="elo" style="font-size: 0.82rem; font-weight: 600; color: var(--gold);">${game.rated ? 'Rated' : 'Casual'}</div>
                </div>
              `;
            }).join('');
          }
        } catch(err) {
          listEl.innerHTML = `<p style="color: var(--red); font-size: 0.95rem; text-align: center; padding: 20px 0;">Failed to load game history.</p>`;
        }
      } else {
        listEl.innerHTML = `
          <div style="background: var(--surface-2); border: 1px solid rgba(232,181,74,0.15); border-radius: 10px; padding: 20px; text-align: center;">
            <p style="color: var(--smoke); font-size: 0.9rem; margin-bottom: 12px;">Sign in with your email or Google account to view the player's match history.</p>
            <button class="pbtn pbtn-gold" style="width: auto; padding: 8px 16px; font-size: 0.85rem;" onclick="renderLoginPrompt()">Sign In</button>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
